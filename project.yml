name: Huisonderhoud
options:
  bundleIdPrefix: nl.basisapps
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: nl
  createIntermediateGroups: true

# Deze xcodegen-installatie laadt geen standaard SettingPresets, dus alle
# benodigde build settings staan hier expliciet.
settings:
  base:
    SDKROOT: iphoneos
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ALWAYS_SEARCH_USER_PATHS: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: -Onone
      ENABLE_TESTABILITY: YES
      ONLY_ACTIVE_ARCH: YES
    Release:
      SWIFT_OPTIMIZATION_LEVEL: -O

targets:
  Huisonderhoud:
    type: application
    platform: iOS
    sources:
      - Huisonderhoud
    settings:
      base:
        PRODUCT_NAME: Huisonderhoud
        PRODUCT_BUNDLE_IDENTIFIER: nl.basisapps.huisonderhoud
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
    info:
      path: Huisonderhoud/Info.plist
      properties:
        CFBundleDisplayName: Huisonderhoud
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: nl
        CFBundleLocalizations:
          - nl
        UILaunchScreen:
          UIColorName: surface
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts:
          - SchibstedGrotesk-Regular.ttf
          - SchibstedGrotesk-Medium.ttf
          - SchibstedGrotesk-SemiBold.ttf
          - SchibstedGrotesk-Bold.ttf
          - BarlowCondensed-SemiBold.ttf
          - BarlowCondensed-Bold.ttf

  HuisonderhoudTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - HuisonderhoudTests
      - path: docs/onderhoudstaken.schema.json
        buildPhase: resources
    dependencies:
      - target: Huisonderhoud
    settings:
      base:
        PRODUCT_NAME: HuisonderhoudTests
        PRODUCT_BUNDLE_IDENTIFIER: nl.basisapps.huisonderhoud.tests
        ENABLE_TESTING_SEARCH_PATHS: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @loader_path/Frameworks"
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Huisonderhoud.app/Huisonderhoud"
        BUNDLE_LOADER: "$(TEST_HOST)"

  HuisonderhoudUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - HuisonderhoudUITests
    dependencies:
      - target: Huisonderhoud
    settings:
      base:
        PRODUCT_NAME: HuisonderhoudUITests
        PRODUCT_BUNDLE_IDENTIFIER: nl.basisapps.huisonderhoud.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Huisonderhoud
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @loader_path/Frameworks"

schemes:
  Huisonderhoud:
    build:
      targets:
        Huisonderhoud: all
        HuisonderhoudTests: [test]
        HuisonderhoudUITests: [test]
    test:
      targets:
        - HuisonderhoudTests
        - HuisonderhoudUITests
